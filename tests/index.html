<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Suite de Tests - Edu-Mateesco</title>
    <!-- Bootstrap & FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <!-- CodeMirror (Dépendance requise par certains scripts, même si on ne l'affiche pas) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <style>
        body { padding: 20px; }
        .test-container { max-width: 900px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="mb-4"><i class="fas fa-vial me-2"></i>Tests Unitaires & Intégration</h1>
        
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Résultats</span>
                <div id="test-summary">En attente...</div>
            </div>
            <div class="card-body" id="test-results">
                <!-- Les résultats s'afficheront ici -->
            </div>
        </div>

        <div class="text-center">
            <button class="btn btn-primary" onclick="location.reload()">
                <i class="fas fa-sync me-2"></i>Relancer les tests
            </button>
            <a href="../index.html" class="btn btn-outline-secondary ms-2">Retour à l'application</a>
        </div>
    </div>

    <!-- 1. Configuration de l'environnement de test -->
    <script>
        // Mock de l'environnement pour que les scripts JS fonctionnent
        const IS_STATIC_VERSION = true;
        
        // Mock de CodeMirror si nécessaire
        var codeEditorInstance = {
            getValue: () => window.lastGeneratedCode || "",
            setValue: (val) => { window.lastGeneratedCode = val; }
        };

        // Hack pour rediriger le fetch de MyCFG.py qui est dans le dossier parent
        const originalFetch = window.fetch;
        window.fetch = function(url, options) {
            if (url === 'MyCFG.py') {
                console.log("[Test Mock] Redirection de MyCFG.py vers ../MyCFG.py");
                return originalFetch('../MyCFG.py', options);
            }
            return originalFetch(url, options);
        };
    </script>

    <!-- 2. Chargement des scripts de l'application (depuis le dossier parent) -->
    <script src="../js/generation-requirements.js"></script>
    <script src="../js/code-generator.js"></script>
    <script src="../js/flowchart-generator.js"></script>
    <!-- On ne charge pas main.js car il lance trop de choses au démarrage (DOM, events). 
         On testera ses fonctions unitairement si besoin ou on extraira la logique. -->

    <!-- 3. Chargement du Framework de Test -->
    <script src="test-runner.js"></script>

    <!-- 4. Chargement des Suites de Tests -->
    <script src="test-generation-requirements.js"></script>
    <script src="test-codegen.js"></script>
    <script src="test-mycfg.js"></script>
    <script src="test-flowchart-selection.js"></script>
    <!-- <script src="test-integration.js"></script> (À créer plus tard) -->

</body>
</html>
