<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pyodide Flowchart Exerciser</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.8/lib/codemirror.css">
  <!-- Optional: A dark theme for CodeMirror -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.8/theme/dracula.css">
  <!-- flowchart.js -->
  <script src="https://cdn.jsdelivr.net/npm/flowchart.js@1.15.0/dist/flowchart.min.js"></script>
  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

  <!-- main CSS if needed -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <div class="container my-4">
    <h1 class="mb-4">Pyodide Flowchart Exerciser</h1>

    <!-- Panel for difficulty & syntax choices -->
    <div class="mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-auto">
          <label for="difficultySelect" class="form-label">Difficulty:</label>
          <select id="difficultySelect" class="form-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label d-block">Syntax Elements:</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="includeIf" checked>
            <label class="form-check-label" for="includeIf">if/else</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="includeFor" checked>
            <label class="form-check-label" for="includeFor">for loop</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="includeWhile">
            <label class="form-check-label" for="includeWhile">while loop</label>
          </div>
        </div>
        <div class="col-auto">
          <label class="form-label">Variable Types:</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="typeInt" checked>
            <label class="form-check-label" for="typeInt">int</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="typeBool" checked>
            <label class="form-check-label" for="typeBool">bool</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="typeStr">
            <label class="form-check-label" for="typeStr">str</label>
          </div>
        </div>
        <div class="col-auto">
          <button id="btnGenerate" class="btn btn-primary">Generate Code</button>
        </div>
      </div>
    </div>

    <!-- Code editor & Flowchart toggle -->
    <div class="mb-3">
      <button id="btnToggleView" class="btn btn-secondary">Toggle View (Code/Flowchart)</button>
      <button id="btnRunCode" class="btn btn-success ms-2">Run & Check</button>
    </div>

    <!-- Editor container -->
    <div id="editorContainer" style="width: 100%; height: 300px; display: block;">
      <textarea id="codeEditor"></textarea>
    </div>

    <!-- Flowchart container (hidden by default) -->
    <div id="flowchartContainer" class="mt-3" style="display: none;">
      <div id="flowchartDiagram"></div>
    </div>

    <!-- Results / Feedback Section -->
    <div id="feedbackSection" class="mt-4"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- CodeMirror JS -->
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.8/lib/codemirror.js"></script>
  <!-- CodeMirror Python Mode -->
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.8/mode/python/python.js"></script>
  <!-- Our main JS -->
  <script src="main.js"></script>
</body>
</html>
